<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <clipPath id="clip">
      <rect width="400" height="400" rx="80"/>
    </clipPath>
  </defs>

  <!-- 背景: 深い紫紺 -->
  <rect width="400" height="400" rx="80" fill="#0e0620"/>

  <g clip-path="url(#clip)">
    <!-- D 後ろ (薄め、少し右下にオフセット) -->
    <polygon points="80,20 80,420 260,420 460,210 260,20" fill="#4f46e5" opacity="0.35"/>
    <polygon points="148,78 148,322 256,322 356,210 256,98" fill="#0e0620" opacity="0.5"/>

    <!-- D 前 (鋭角、左上にオフセット) -->
    <polygon points="50,-10 50,390 230,390 430,190 230,-10" fill="#7c3aed"/>
    <polygon points="118,58 118,302 224,302 320,190 224,78" fill="#0e0620"/>

    <!-- 右端の縦ライン -->
    <rect x="368" y="20" width="18" height="360" rx="0" fill="#a78bfa" opacity="0.6"/>

    <!-- 左端の縦ライン -->
    <rect x="50" y="20" width="10" height="360" rx="0" fill="#38bdf8" opacity="0.4"/>
  </g>
</svg>
